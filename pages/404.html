<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Figaro Cafe</title>
    <link rel="shortcut icon" href="../assets/logo.svg" type="image/x-icon">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #FFF8F0 0%, #F5E6D3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .error-container {
            text-align: center;
            max-width: 600px;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }
        
        .error-icon {
            font-size: 100px;
            color: #B8905F;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 80px;
            color: #1A1A1A;
            margin-bottom: 20px;
        }
        
        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #B8905F;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }
        
        .btn-primary {
            background: #1A1A1A;
            color: white;
        }
        
        .btn-primary:hover {
            background: #B8905F;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(184, 144, 95, 0.3);
        }
        
        .btn-secondary {
            background: transparent;
            color: #1A1A1A;
            border: 2px solid #1A1A1A;
        }
        
        .btn-secondary:hover {
            background: #1A1A1A;
            color: white;
            transform: translateY(-3px);
        }
        
        .coffee-animation {
            margin-top: 40px;
            font-size: 40px;
            color: #B8905F;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-mug-hot"></i>
        </div>
        
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>
        
        <p>
            Looks like this page took a coffee break and forgot to come back! ☕<br>
            The page you're looking for doesn't exist or has been moved.
        </p>
        
        <div class="btn-group">
            <a href="../index.html" class="btn btn-primary">
                <i class="fas fa-home"></i>
                Go Home
            </a>
            <a href="menu.html" class="btn btn-secondary">
                <i class="fas fa-coffee"></i>
                View Menu
            </a>
        </div>
        
        <div class="coffee-animation">
            <i class="fas fa-coffee"></i>
            <i class="fas fa-coffee"></i>
            <i class="fas fa-coffee"></i>
        </div>
    </div>
</body>
</html>
